<!-- HUGE STATS -->

<div class="section stats-section">

<div class="stats-number" id="counter">
0M+
</div>

<div class="stats-label">
Views Generated For Clients
</div>

<!-- PROOF IMAGES -->

<div class="proof-wrapper">

<div class="proof-card">

<img src="before.jpg" alt="Before Growth">

<div class="proof-text">
1K Subscribers
</div>

</div>

<div class="proof-card">

<img src="after.jpg" alt="After Growth">

<div class="proof-text">
136K Subscribers
</div>

</div>

</div>

</div>

<style>

/* HUGE STATS SECTION */

.stats-section{
  padding:220px 0;
  text-align:center;
  overflow:hidden;
}

.stats-number{
  font-size:13vw;
  font-weight:900;
  line-height:0.9;
  color:#00ff99;
  letter-spacing:-10px;
  width:100%;
  text-align:center;

  text-shadow:
  0 0 40px rgba(0,255,153,0.25),
  0 0 120px rgba(0,255,153,0.08);
}

.stats-label{
  margin-top:25px;
  font-size:1.3rem;
  color:#8f8f8f;
  letter-spacing:4px;
  text-transform:uppercase;
}

/* PROOF SECTION */

.proof-wrapper{
  margin-top:100px;
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.proof-card{
  width:420px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:24px;
  overflow:hidden;
  backdrop-filter:blur(14px);

  transition:0.4s ease;
}

.proof-card:hover{
  transform:translateY(-8px);
  box-shadow:
  0 0 40px rgba(0,255,140,0.12);
}

.proof-card img{
  width:100%;
  display:block;
}

.proof-text{
  padding:20px;
  font-size:1.2rem;
  font-weight:700;
  color:white;
}

/* MOBILE */

@media(max-width:768px){

  .stats-number{
    font-size:22vw;
    letter-spacing:-4px;
  }

  .stats-label{
    font-size:0.9rem;
    padding:0 10px;
  }

  .proof-card{
    width:100%;
  }

}

</style>

<script>

/* COUNTER ANIMATION */

let started = false;

function animateCounter(){

  const counter = document.getElementById('counter');

  const target = 100;

  let count = 0;

  const interval = setInterval(() => {

    count++;

    counter.innerHTML = count + 'M+';

    if(count >= target){

      clearInterval(interval);

    }

  }, 25);

}

window.addEventListener('scroll', () => {

  const statsSection = document.querySelector('.stats-section');

  if(!statsSection) return;

  const top = statsSection.getBoundingClientRect().top;

  if(top < window.innerHeight - 100 && !started){

    started = true;

    animateCounter();

  }

});

</script>
