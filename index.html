<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Editor Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top right, rgba(0,255,140,0.08), transparent 30%),
  radial-gradient(circle at bottom left, rgba(0,255,140,0.05), transparent 35%);
  pointer-events:none;
  z-index:0;
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  opacity:0.03;
  background-image:url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
  pointer-events:none;
  z-index:0;
}

.cursor-glow{
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle, rgba(0,255,140,0.12), transparent 70%);
  pointer-events:none;
  transform:translate(-50%, -50%);
  z-index:0;
  filter:blur(10px);
}

.container{
  width:96%;
  max-width:1800px;
  margin:auto;
  position:relative;
  z-index:2;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding-top:70px;
  text-align:center;
}

h1{
  font-size:5rem;
  font-weight:900;
  line-height:1.05;
  letter-spacing:-3px;
  margin-bottom:20px;
  max-width:1100px;
}

h2{
  font-size:2.3rem;
  font-weight:800;
  margin-bottom:30px;
}

p{
  color:#bdbdbd;
  line-height:1.7;
}

.highlight{
  color:#00ff99;
  text-shadow:0 0 20px rgba(0,255,153,0.35);
}

/* SECTION */

.section{
  padding:110px 0;
  opacity:0;
  transform:translateY(40px);
  transition:all 1s ease;
}

.section.show{
  opacity:1;
  transform:translateY(0);
}

/* CARD */

.card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(14px);
  padding:15px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,0.06);
  transition:all 0.45s ease;
  overflow:hidden;
  position:relative;
  text-decoration:none;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
  box-shadow:
  0 0 40px rgba(0,255,140,0.12),
  0 0 120px rgba(0,255,140,0.06);
  border-color:rgba(0,255,140,0.18);
}

/* SHOWREEL */

.showreel{
  margin-top:35px;
  width:82%;
}

.showreel iframe{
  width:100%;
  aspect-ratio:16/9;
  border:none;
  border-radius:26px;
  box-shadow:0 0 80px rgba(0,255,140,0.08);
}

/* THUMB */

.thumb-vertical{
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  border-radius:18px;
  transition:0.5s ease;
}

.video-thumb{
  width:100%;
  border-radius:18px;
  transition:0.5s ease;
}

.card:hover img{
  transform:scale(1.04);
}

/* VIRAL FLEX */

.flex{
  display:flex;
  gap:40px;
  align-items:center;
  margin-bottom:80px;
}

.flex.reverse{
  flex-direction:row-reverse;
}

.viral-card{
  flex:0.65;
}

.text-box{
  max-width:420px;
}

.text-box h3{
  font-size:2.5rem;
  font-weight:900;
  margin-bottom:12px;
  color:#ff4d4d;
  text-shadow:0 0 30px rgba(255,77,77,0.4);
}

.text-box p:first-of-type{
  color:#00ff99;
  font-weight:700;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(320px, 380px));
  justify-content:center;
  gap:35px;
}

.grid p{
  color:#00ff99;
  font-weight:700;
  margin-top:12px;
}

/* BUTTON */

.button{
  display:inline-block;
  padding:18px 36px;
  background:linear-gradient(135deg,#00ff99,#00c26e);
  color:black;
  border-radius:14px;
  text-decoration:none;
  margin-top:20px;
  font-weight:800;
  transition:0.35s ease;
  width:fit-content;
}

.button:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,255,140,0.35);
}

/* STATS */

.stats-section{
  padding:160px 0;
  text-align:center;
}

.big-counter{
  font-size:8vw;
  font-weight:900;
  line-height:1;
  color:#00ff99;
  letter-spacing:-5px;
  text-shadow:0 0 60px rgba(0,255,140,0.2);
}

.stats-subtext{
  font-size:2rem;
  margin-top:20px;
  color:white;
  font-weight:700;
}

/* BEFORE AFTER */

.proof-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
  margin-top:60px;
}

.proof-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.outside-heading{
  font-size:1rem;
  letter-spacing:4px;
  color:#00ff99;
  font-weight:800;
  margin-bottom:18px;
}

.outside-text{
  margin-top:18px;
  font-size:1rem;
  color:#bdbdbd;
  text-align:center;
}

.proof-card{
